# ==============================================================================
# Nginx VirtualHosts — Ecossistema DK Facilita (Ubuntu 22.04 / 24.04)
# Domínios:
#   - dkfacilita.com e www.dkfacilita.com (Site Institucional + Checkout)
#   - certifica.dkfacilita.com (Painel SaaS Multiempresa)
#   - admin.dkfacilita.com (Painel Super Admin)
#   - api.dkfacilita.com (Backend API Express + Webhook Mercado Pago)
#
# Instalação:
#   sudo cp deploy/nginx-dkfacilita.conf /etc/nginx/sites-available/dkfacilita.conf
#   sudo ln -sf /etc/nginx/sites-available/dkfacilita.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dkfacilita.com -d www.dkfacilita.com -d certifica.dkfacilita.com -d admin.dkfacilita.com -d api.dkfacilita.com
# ==============================================================================

upstream dkfacilita_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. SITE INSTITUCIONAL + CHECKOUT (dkfacilita.com)
server {
    listen 80;
    listen [::]:80;
    server_name dkfacilita.com www.dkfacilita.com;

    root /var/www/dkfacilita/dist;
    index index.html;

    client_max_body_size 25M;

    # Compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy para rotas da API e Webhooks no domínio principal
    location /api/ {
        proxy_pass http://dkfacilita_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://dkfacilita_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache longo para assets estáticos com hash do Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. SISTEMA SAAS CLIENTE — CERTIFICA SOFTWARE - DK (certifica.dkfacilita.com)
server {
    listen 80;
    listen [::]:80;
    server_name certifica.dkfacilita.com;

    root /var/www/dkfacilita/dist;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://dkfacilita_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. PAINEL SUPER ADMIN (admin.dkfacilita.com)
server {
    listen 80;
    listen [::]:80;
    server_name admin.dkfacilita.com;

    root /var/www/dkfacilita/dist;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://dkfacilita_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 4. BACKEND API & WEBHOOK MERCADO PAGO (api.dkfacilita.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.dkfacilita.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://dkfacilita_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
