# ==============================================================================
# Apache2 VirtualHosts — Ecossistema DK Facilita (Ubuntu 22.04 / 24.04)
# Módulos necessários:
#   sudo a2enmod proxy proxy_http rewrite headers ssl
# Instalação:
#   sudo cp deploy/apache-dkfacilita.conf /etc/apache2/sites-available/dkfacilita.conf
#   sudo a2ensite dkfacilita.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d dkfacilita.com -d www.dkfacilita.com -d certifica.dkfacilita.com -d admin.dkfacilita.com -d api.dkfacilita.com
# ==============================================================================

# 1. SITE INSTITUCIONAL + CHECKOUT (dkfacilita.com)
<VirtualHost *:80>
    ServerName dkfacilita.com
    ServerAlias www.dkfacilita.com
    DocumentRoot /var/www/dkfacilita/dist

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass /webhooks/ http://127.0.0.1:3000/webhooks/
    ProxyPassReverse /webhooks/ http://127.0.0.1:3000/webhooks/

    <Directory /var/www/dkfacilita/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/dkfacilita-site-error.log
    CustomLog ${APACHE_LOG_DIR}/dkfacilita-site-access.log combined
</VirtualHost>

# 2. SISTEMA SAAS CLIENTE (certifica.dkfacilita.com)
<VirtualHost *:80>
    ServerName certifica.dkfacilita.com
    DocumentRoot /var/www/dkfacilita/dist

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    <Directory /var/www/dkfacilita/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/dkfacilita-certifica-error.log
    CustomLog ${APACHE_LOG_DIR}/dkfacilita-certifica-access.log combined
</VirtualHost>

# 3. PAINEL SUPER ADMIN (admin.dkfacilita.com)
<VirtualHost *:80>
    ServerName admin.dkfacilita.com
    DocumentRoot /var/www/dkfacilita/dist

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    <Directory /var/www/dkfacilita/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/dkfacilita-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/dkfacilita-admin-access.log combined
</VirtualHost>

# 4. BACKEND API & WEBHOOK MERCADO PAGO (api.dkfacilita.com)
<VirtualHost *:80>
    ServerName api.dkfacilita.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/dkfacilita-api-error.log
    CustomLog ${APACHE_LOG_DIR}/dkfacilita-api-access.log combined
</VirtualHost>
