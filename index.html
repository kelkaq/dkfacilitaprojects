<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK Facilita — Certifica Software - DK</title>
    <meta
      name="description"
      content="Ecossistema comercial multiempresa da DK Facilita com o produto principal Certifica Software - DK para gestão de treinamentos de NRs, provas digitais, certificados com QR Code e dossiês de colaboradores."
    />
    <meta property="og:title" content="DK Facilita — Certifica Software - DK" />
    <meta
      property="og:description"
      content="Ecossistema comercial multiempresa da DK Facilita com o produto principal Certifica Software - DK para gestão de treinamentos de NRs, provas digitais, certificados com QR Code e dossiês de colaboradores."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dkfacilita_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#060913] text-[#0F172A] dark:text-slate-100 antialiased selection:bg-[#3B82F6] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
